services:
  - type: web
    name: argus-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: argus-db
          property: connectionString

databases:
  - name: argus-db
    plan: free
    databaseName: argus
    ipAllowList: []
